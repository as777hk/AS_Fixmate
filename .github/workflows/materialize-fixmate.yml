name: Materialize FixMate application source

on:
  push:
    paths:
      - ".fixmate-bundle/**"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand source and create the assignment commit history
        run: |
          python - <<'PYCODE'
          import json, pathlib, shutil, subprocess, tempfile, base64

          bundle = pathlib.Path(".fixmate-bundle")
          parts = sorted(bundle.glob("part-*"))
          if not parts:
              raise SystemExit("No FixMate source parts were found.")
          encoded = pathlib.Path("/tmp/fixmate-source.tar.gz.b64")
          with encoded.open("wb") as target:
              for part in parts:
                  target.write(part.read_bytes())
          archive = pathlib.Path("/tmp/fixmate-source.tar.gz")
          archive.write_bytes(base64.b64decode(encoded.read_bytes(), validate=True))
          with tempfile.TemporaryDirectory(prefix="fixmate-") as temp:
              source = pathlib.Path(temp) / "source"
              source.mkdir()
              subprocess.run(["tar", "-xzf", str(archive), "-C", str(source)], check=True)
              for child in source.iterdir():
                  destination = pathlib.Path(child.name)
                  if child.is_dir():
                      shutil.copytree(child, destination, dirs_exist_ok=True)
                  else:
                      shutil.copy2(child, destination)

          groups = json.loads(r"""{"client":[["client: establish the application workspace and project configuration",["README.md",".gitignore","package.json","client/.env.local.example","client/package.json","client/next-env.d.ts","client/next.config.ts","client/postcss.config.mjs","client/tsconfig.json"]],["client: add the public shell and core responsive design system",["client/src/app/layout.tsx","client/src/app/globals.css","client/src/app/(public)/layout.tsx","client/src/components/providers.tsx"]],["client: build the FixMate brand, navigation, footer, and identity controls",["client/src/components/brand.tsx","client/src/components/navbar.tsx","client/src/components/footer.tsx","client/src/components/avatar.tsx"]],["client: add reusable service cards, status UI, charts, and confirmation dialogs",["client/src/components/section-heading.tsx","client/src/components/service-card.tsx","client/src/components/stat-card.tsx","client/src/components/status-badge.tsx","client/src/components/empty-state.tsx","client/src/components/data-table.tsx","client/src/components/booking-timeline.tsx","client/src/components/revenue-chart.tsx","client/src/components/confirm-dialog.tsx"]],["client: introduce the repair-console landing page and category discovery",["client/src/app/(public)/page.tsx","client/public/images/repair-placeholder.svg"]],["client: implement the searchable server-filtered service directory",["client/src/app/(public)/services/page.tsx"]],["client: build service detail pages and customer-only repair requests",["client/src/app/(public)/services/[id]/page.tsx"]],["client: configure Better Auth, role safeguards, and Next.js auth handlers",["client/src/lib/auth.ts","client/src/app/api/auth/[...all]/route.ts"]],["client: connect typed API utilities, JWT client integration, and domain models",["client/src/lib/api.ts","client/src/lib/auth-client.ts","client/src/types/index.ts"]],["client: create the role-aware customer and technician registration experience",["client/src/app/(public)/sign-up/page.tsx"]],["client: add secure sign-in and role-based post-login routing",["client/src/app/(public)/sign-in/page.tsx"]],["client: add platform guidance and Stripe payment result pages",["client/src/app/(public)/about/page.tsx","client/src/app/(public)/payment/success/page.tsx","client/src/app/(public)/payment/cancel/page.tsx"]],["client: build responsive authenticated workspace navigation and route guards",["client/src/components/workspace.tsx","client/src/components/require-role.tsx","client/src/components/dashboard-nav.tsx"]],["client: add customer dashboard overview and request statistics",["client/src/app/dashboard/customer/page.tsx"]],["client: add customer bookings, repair progress timeline, cancellation, and checkout",["client/src/app/dashboard/customer/bookings/page.tsx"]],["client: add customer payment history and transaction details",["client/src/app/dashboard/customer/payments/page.tsx"]],["client: build technician dashboard and ImgBB-backed service creation",["client/src/app/dashboard/technician/page.tsx","client/src/app/dashboard/technician/add-service/page.tsx"]],["client: implement technician service management and repair request workflows",["client/src/app/dashboard/technician/my-services/page.tsx","client/src/app/dashboard/technician/requests/page.tsx"]],["client: add admin overview metrics and revenue visualisation",["client/src/app/dashboard/admin/page.tsx"]],["client: complete admin controls, profile management, and resilient app states",["client/src/app/dashboard/admin/users/page.tsx","client/src/app/dashboard/admin/services/page.tsx","client/src/app/dashboard/admin/bookings/page.tsx","client/src/app/dashboard/admin/transactions/page.tsx","client/src/app/dashboard/profile/page.tsx","client/src/app/error.tsx","client/src/app/not-found.tsx","client/src/app/loading.tsx"]]],"server":[["server: configure the Express workspace, environment contract, and Vercel entry point",["server/package.json","server/.env.example","server/index.js"]],["server: add shared MongoDB connection management and HTTP utilities",["server/src/config/db.js","server/src/utils/http.js"]],["server: implement Better Auth JWT verification and role-based API middleware",["server/src/middleware/auth.js"]],["server: add approved service discovery with MongoDB search, filters, sorting, and pagination",["server/src/routes/services.js"]],["server: enforce booking ownership, duplicate prevention, and the repair status pipeline",["server/src/routes/bookings.js"]],["server: implement authenticated customer profile reads and updates",["server/src/routes/users.js"]],["server: secure technician image uploads through ImgBB",["server/src/routes/uploads.js"]],["server: build protected admin user, moderation, booking, and reporting APIs",["server/src/routes/admin.js"]],["server: integrate Stripe Checkout, verification, and idempotent webhook persistence",["server/src/routes/payments.js"]],["server: compose the versioned application API router",["server/src/routes/index.js"]],["server: configure Express security, CORS, webhook parsing, and production handlers",["server/src/index.js"]],["server: seed demo roles, fourteen approved services, and sample repair journeys",["server/scripts/seed.js"]]]}""")
          expected_client = len(groups["client"])
          expected_server = len(groups["server"])
          for area in ("client", "server"):
              for message, paths in groups[area]:
                  subprocess.run(["git", "add", "-A", "--", *paths], check=True)
                  staged = subprocess.run(["git", "diff", "--cached", "--quiet"]).returncode
                  if staged == 0:
                      raise SystemExit(f"No changes staged for required commit: {message}")
                  subprocess.run(["git", "commit", "-m", message], check=True)

          status = subprocess.run(["git", "status", "--porcelain"], check=True, capture_output=True, text=True).stdout.strip()
          if status:
              raise SystemExit("Unmapped source files remain after the client/server commit plan:\n" + status)
          if expected_client != 20 or expected_server != 12:
              raise SystemExit("Commit-plan count does not satisfy the assignment.")

          shutil.rmtree(bundle)
          workflow = pathlib.Path(".github/workflows/materialize-fixmate.yml")
          workflow.unlink(missing_ok=True)
          subprocess.run(["git", "add", "-A", "--", ".fixmate-bundle", ".github/workflows/materialize-fixmate.yml"], check=True)
          subprocess.run(["git", "commit", "-m", "chore: remove the one-time source import workflow and bundle"], check=True)
          subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)
          print(f"Published {expected_client} client commits and {expected_server} server commits.")
          PYCODE
